[project]
name = "minitriton"
version = "0.1.0"
description = "一个用于学习的迷你 Triton：Python -> IR -> CUDA -> PTX -> cubin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
